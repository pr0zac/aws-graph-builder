[project]
name = "aws-graph-builder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.62",
    "networkx>=3.6.1",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[project.scripts]
aws-graph-builder = "aws_graph_builder.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_graph_builder"]

[dependency-groups]
dev = [
    "boto3-stubs[ec2,iam,lambda,organizations,s3,sts]>=1.43.62",
    "moto>=5.2.2",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "types-networkx>=3.6.1.20260728",
]
